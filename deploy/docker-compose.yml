services:
  mysql:
    image: mysql:8.0
    container_name: bm-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: bm123456
      MYSQL_DATABASE: big_market
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max_connections=200
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pbm123456"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: bm-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 192m

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bm-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 0.6
    ports:
      - "127.0.0.1:5672:5672"
      - "15672:15672"
    mem_limit: 320m

  app:
    build: ./app
    container_name: bm-app
    restart: always
    environment:
      APP_PORT: 8080
      MYSQL_DSN: "root:bm123456@tcp(mysql:3306)/big_market?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "redis:6379"
      RABBITMQ_URL: "amqp://admin:admin@rabbitmq:5672/"
      JWT_SECRET: "big-market-go-2026"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 256m

  nginx:
    image: nginx:1.27-alpine
    container_name: bm-nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - app
    mem_limit: 64m
